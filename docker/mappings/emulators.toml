# Semantic mapping for the generic ECUEmulator field names.
# The emulators expose the same raw names on every node (pressure0, temp0,
# actuator0, digital0, ...). FerroFlow uses this file to present the
# node-specific/semantic names.

# Fuel ECU (old CANMapping node 31: fuel_ecu)
[[mapping.FuelECU]]
name = "fuel_tank_pressure"
type = "telemetry"
raw_field = "pressure0"
value = { slope = 0.01888275146, offset = -15.0, unit = "bar" }

